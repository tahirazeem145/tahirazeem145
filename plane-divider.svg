<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 64" width="100%" height="64" fill="none" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Glow Filters -->
    <filter id="planeGlow" x="-30%" y="-40%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="strobeGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="thrustGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Flight Corridor Path Gradient -->
    <linearGradient id="flightPathGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0" />
      <stop offset="15%" stop-color="#58a6ff" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.5" />
      <stop offset="85%" stop-color="#58a6ff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </linearGradient>

    <!-- Jet Contrail Gradient (High Density Vapor Trail) -->
    <linearGradient id="contrailGrad" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="15%" stop-color="#a5f3fc" stop-opacity="0.7" />
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="80%" stop-color="#0284c7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </linearGradient>

    <!-- Jet Engine Afterburner Flame Gradient -->
    <linearGradient id="thrustFlameGrad" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="25%" stop-color="#67e8f9" stop-opacity="1" />
      <stop offset="65%" stop-color="#0284c7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <!-- Fuselage Metallic Gradient -->
    <linearGradient id="fuselageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#e2e8f0" />
      <stop offset="75%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Cabin & Cockpit Window Glow -->
    <linearGradient id="windowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- ========================================================== -->
  <!-- 1. RADAR FLIGHT CORRIDOR & AIRWAY TELEMETRY                -->
  <!-- ========================================================== -->

  <!-- Base Dark Flight Line -->
  <line x1="40" y1="32" x2="1160" y2="32" stroke="#21262d" stroke-width="1.2" />

  <!-- Flowing Dashed Airway Navigation Vector -->
  <line x1="60" y1="32" x2="1140" y2="32" stroke="url(#flightPathGrad)" stroke-width="1.5" stroke-dasharray="12 20" opacity="0.8">
    <animate attributeName="stroke-dashoffset" from="0" to="-320" dur="6s" repeatCount="indefinite" />
  </line>

  <!-- Flight Waypoints and Telemetry HUD -->
  <g opacity="0.65" font-family="'JetBrains Mono', monospace" font-size="6.5" font-weight="600" fill="#8b949e">
    <!-- Departure / Origin -->
    <circle cx="140" cy="32" r="2.2" fill="#58a6ff" />
    <text x="140" y="22" text-anchor="middle" fill="#58a6ff">✈ FLIGHT TA-145</text>

    <!-- Mid-Airway Cruising Waypoint -->
    <circle cx="600" cy="32" r="2.8" fill="#a855f7" />
    <text x="600" y="22" text-anchor="middle" fill="#c084fc">ALT: 36,000 FT // CRUISE // MACH 0.85</text>
    <line x1="585" y1="32" x2="615" y2="32" stroke="#a855f7" stroke-width="1.2" />

    <!-- Arrival / Destination -->
    <circle cx="1060" cy="32" r="2.2" fill="#58a6ff" />
    <text x="1060" y="22" text-anchor="middle" fill="#58a6ff">DEST: PRODUCTION ✈</text>
  </g>

  <!-- High-Altitude Cirrus Cloud Layer -->
  <g opacity="0.2">
    <path d="M80,48 Q140,42 210,48 Q270,52 330,48" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round">
      <animate attributeName="transform" type="translate" values="0,0; -40,0; 0,0" dur="20s" repeatCount="indefinite" />
    </path>
    <path d="M500,50 Q570,44 640,50 Q710,54 780,50" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round">
      <animate attributeName="transform" type="translate" values="0,0; -50,0; 0,0" dur="24s" repeatCount="indefinite" />
    </path>
    <path d="M920,48 Q980,43 1050,48 Q1110,52 1170,48" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round">
      <animate attributeName="transform" type="translate" values="0,0; -40,0; 0,0" dur="22s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- ========================================================== -->
  <!-- 2. PRIMARY AIRPLANE (CRUISING ACROSS FLIGHT PATH)          -->
  <!-- ========================================================== -->
  <g>
    <!-- Master Movement: Smooth 8.5s left-to-right traversal -->
    <animateTransform attributeName="transform" type="translate" from="-180 0" to="1260 0" dur="8.5s" repeatCount="indefinite" />

    <!-- Aerodynamic Altitude Float (Gentle Wave) -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 32; 0 30; 0 34; 0 32" dur="3.6s" repeatCount="indefinite" />

      <!-- A. EXPANDING JET ENGINE CONTRAIL TRAILS -->
      <g opacity="0.9">
        <!-- Top Engine Contrail -->
        <rect x="-240" y="-4.5" width="225" height="3" rx="1.5" fill="url(#contrailGrad)">
          <animate attributeName="width" values="200;240;200" dur="1.8s" repeatCount="indefinite" />
          <animate attributeName="opacity" values="0.75;1;0.75" dur="1.8s" repeatCount="indefinite" />
        </rect>
        <!-- Bottom Engine Contrail -->
        <rect x="-240" y="5.5" width="225" height="3.2" rx="1.6" fill="url(#contrailGrad)">
          <animate attributeName="width" values="210;250;210" dur="1.8s" begin="-0.9s" repeatCount="indefinite" />
          <animate attributeName="opacity" values="0.8;1;0.8" dur="1.8s" begin="-0.9s" repeatCount="indefinite" />
        </rect>
      </g>

      <!-- B. JET ENGINE AFTERBURNER FLAMES (THRUST) -->
      <g filter="url(#thrustGlow)">
        <!-- Top Engine Flame -->
        <polygon points="-16,-4.5 -38,-3 -16,-1.5" fill="url(#thrustFlameGrad)">
          <animate attributeName="points" values="-16,-4.5 -38,-3 -16,-1.5; -16,-4.5 -46,-3 -16,-1.5; -16,-4.5 -38,-3 -16,-1.5" dur="0.22s" repeatCount="indefinite" />
        </polygon>
        <!-- Bottom Engine Flame -->
        <polygon points="-10,5.5 -34,7 -10,8.5" fill="url(#thrustFlameGrad)">
          <animate attributeName="points" values="-10,5.5 -34,7 -10,8.5; -10,5.5 -42,7 -10,8.5; -10,5.5 -34,7 -10,8.5" dur="0.25s" repeatCount="indefinite" />
        </polygon>
      </g>

      <!-- C. THE AIRCRAFT (MODERN TWIN-ENGINE COMMERCIAL JET) -->
      <g filter="url(#planeGlow)">

        <!-- 1. Background Port Wing (Far Wing) -->
        <polygon points="-8,-5 12,-5 -18,-20 -25,-19" fill="#475569" stroke="#334155" stroke-width="0.6" />
        <!-- Port Winglet (Turned Upward) -->
        <line x1="-25" y1="-19" x2="-27" y2="-24" stroke="#00f0ff" stroke-width="1.5" />
        <!-- Port Wingtip Red Nav Light -->
        <circle cx="-27" cy="-24" r="1.8" fill="#ef4444" filter="url(#strobeGlow)">
          <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite" />
        </circle>

        <!-- 2. Horizontal Tail Stabilizer -->
        <polygon points="-60,-2 -46,-2 -64,-12 -70,-11" fill="#64748b" stroke="#334155" stroke-width="0.6" />

        <!-- 3. Vertical Tail Fin (Rudder) -->
        <polygon points="-50,-4 -36,-4 -58,-28 -66,-28" fill="url(#fuselageGrad)" stroke="#334155" stroke-width="0.75" />
        <!-- Tail Fin Cyan Airline Livery Stripe -->
        <polygon points="-52,-14 -44,-14 -56,-26 -63,-26" fill="#00f0ff" opacity="0.9" />

        <!-- Flashing White Tail Beacon Strobe -->
        <circle cx="-62" cy="-28" r="2.2" fill="#ffffff" filter="url(#strobeGlow)">
          <animate attributeName="opacity" values="1;0;0;1;0;0" dur="1.1s" repeatCount="indefinite" />
        </circle>

        <!-- 4. Main Fuselage Body -->
        <!-- Streamlined aerodynamic nose to tail cone -->
        <path d="M-64,-1 Q-25,-6 25,-6 Q65,-6 76,1 Q62,8 24,8 Q-25,8 -64,2 Z" fill="url(#fuselageGrad)" stroke="#334155" stroke-width="0.9" />

        <!-- Cockpit Windshield (Aviator Flight Deck) -->
        <path d="M54,-3.5 L63,-2 L60,1 L53,0 Z" fill="url(#windowGrad)" stroke="#0f172a" stroke-width="0.5" />

        <!-- Passenger Window Strip (Illuminated Deck Windows) -->
        <g fill="url(#windowGrad)" opacity="0.9">
          <rect x="-42" y="0" width="3.5" height="2.4" rx="0.6" />
          <rect x="-34" y="0" width="3.5" height="2.4" rx="0.6" />
          <rect x="-26" y="0" width="3.5" height="2.4" rx="0.6" />
          <rect x="-18" y="0" width="3.5" height="2.4" rx="0.6" />
          <rect x="-10" y="0" width="3.5" height="2.4" rx="0.6" />
          <rect x="-2" y="0" width="3.5" height="2.4" rx="0.6" />
          <rect x="6" y="0" width="3.5" height="2.4" rx="0.6" />
          <rect x="14" y="0" width="3.5" height="2.4" rx="0.6" />
          <rect x="22" y="0" width="3.5" height="2.4" rx="0.6" />
          <rect x="30" y="0" width="3.5" height="2.4" rx="0.6" />
          <rect x="38" y="0" width="3.5" height="2.4" rx="0.6" />
          <rect x="46" y="0" width="3.5" height="2.4" rx="0.6" />
        </g>

        <!-- Electric Cyan Livery Speedline -->
        <path d="M-58,4 Q0,4 58,4" stroke="#00f0ff" stroke-width="1" opacity="0.9" />

        <!-- 5. Foreground Starboard Main Wing -->
        <polygon points="-12,4 20,4 -10,22 -20,21" fill="url(#fuselageGrad)" stroke="#334155" stroke-width="0.75" />
        <!-- Starboard Winglet (Turned Upward) -->
        <polygon points="-20,21 -17,27 -14,27 -17,21" fill="#00f0ff" />
        <!-- Starboard Wingtip Green Nav Light -->
        <circle cx="-15.5" cy="27" r="2" fill="#22c55e" filter="url(#strobeGlow)">
          <animate attributeName="opacity" values="1;0.35;1" dur="1s" repeatCount="indefinite" />
        </circle>

        <!-- 6. Turbofan Jet Engines -->
        <!-- Upper Engine (Far Wing Mount) -->
        <g transform="translate(-2, -4)">
          <rect x="-14" y="-1.5" width="20" height="5.5" rx="2" fill="#334155" stroke="#475569" stroke-width="0.6" />
          <line x1="5" y1="-1.5" x2="5" y2="4" stroke="#94a3b8" stroke-width="1" />
        </g>

        <!-- Lower Engine (Near Wing Mount) -->
        <g transform="translate(6, 6)">
          <rect x="-16" y="-1.5" width="24" height="6.5" rx="2.2" fill="#1e293b" stroke="#475569" stroke-width="0.75" />
          <ellipse cx="7" cy="1.7" rx="1.2" ry="2.8" fill="#94a3b8" />
          <!-- Engine Pylon to Wing -->
          <line x1="-3" y1="-1.5" x2="-3" y2="-5" stroke="#475569" stroke-width="1.5" />
        </g>

        <!-- 7. Anti-Collision Red Beacon (Top of Fuselage) -->
        <circle cx="-6" cy="-6.8" r="2" fill="#ef4444" filter="url(#strobeGlow)">
          <animate attributeName="opacity" values="1;0.1;1" dur="0.8s" repeatCount="indefinite" />
        </circle>

      </g>
    </g>
  </g>
</svg>
