name: Generate Contribution Snake Daily

on:
  schedule:
    # Runs every 12 hours at 00:00 and 12:00 UTC
    - cron: "0 0,12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/**'
      - '.github/workflows/snake.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Dynamic Snake SVG
        run: node .github/scripts/generate-snake.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}

      - name: Commit & Push Daily Contribution Snake
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add contribution-snake.svg
          if git diff --staged --quiet; then
            echo "No changes in contribution graph today."
          else
            git commit -m "chore(snake): auto-update contribution snake for $(date +'%Y-%m-%d') [skip ci]"
            git push origin main
          fi
