<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 56" width="100%" height="56" fill="none" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Glow Filters -->
    <filter id="planeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="beaconGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="jetThrustGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Flight Corridor Path Gradient -->
    <linearGradient id="flightPathGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0" />
      <stop offset="15%" stop-color="#58a6ff" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.6" />
      <stop offset="85%" stop-color="#58a6ff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </linearGradient>

    <!-- Contrail Jet Vapor Trail Gradient -->
    <linearGradient id="contrailGrad" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="15%" stop-color="#7dd3fc" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="85%" stop-color="#0284c7" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </linearGradient>

    <!-- Engine Jet Afterburner Flame Gradient -->
    <linearGradient id="engineFlameGrad" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <!-- Aerodynamic Fuselage Metallic Shading -->
    <linearGradient id="fuselageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0f6fc" />
      <stop offset="45%" stop-color="#c9d1d9" />
      <stop offset="85%" stop-color="#484f58" />
      <stop offset="100%" stop-color="#21262d" />
    </linearGradient>

    <!-- Cockpit & Passenger Window Glow -->
    <linearGradient id="windowGlowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- ========================================================== -->
  <!-- 1. FLIGHT AIRWAY CORRIDOR & RADAR NAVIGATION PATH          -->
  <!-- ========================================================== -->

  <!-- Base Ambient Airway Track -->
  <line x1="50" y1="28" x2="1150" y2="28" stroke="#21262d" stroke-width="1" />
  
  <!-- Glowing Radar Vector Line (Dashed Navigation Corridor) -->
  <line x1="80" y1="28" x2="1120" y2="28" stroke="url(#flightPathGrad)" stroke-width="1.2" stroke-dasharray="10 16" opacity="0.65">
    <animate attributeName="stroke-dashoffset" from="0" to="-260" dur="8s" repeatCount="indefinite" />
  </line>

  <!-- Radar Altitude Flight Marks & Waypoints -->
  <g opacity="0.6" font-family="'JetBrains Mono', monospace" font-size="6" fill="#8b949e">
    <!-- Waypoint Alpha (x=160) -->
    <circle cx="160" cy="28" r="2" fill="#58a6ff" />
    <text x="160" y="20" text-anchor="middle" fill="#58a6ff">WPT // ALPHA</text>

    <!-- Waypoint Bravo / Cruising Altitude (x=600) -->
    <circle cx="600" cy="28" r="2.5" fill="#a855f7" />
    <text x="600" y="20" text-anchor="middle" fill="#c084fc">FL380 // MACH 0.84 // TAHIR-AIR</text>
    <line x1="590" y1="28" x2="610" y2="28" stroke="#a855f7" stroke-width="1" />

    <!-- Waypoint Delta (x=1040) -->
    <circle cx="1040" cy="28" r="2" fill="#58a6ff" />
    <text x="1040" y="20" text-anchor="middle" fill="#58a6ff">WPT // DEST_SHIP</text>
  </g>

  <!-- Subtle Drifting Night Sky Cloud Wisps Below Flight Path -->
  <g opacity="0.25">
    <path d="M100,42 Q140,36 190,42 Q230,46 270,42" stroke="#484f58" stroke-width="1.5" fill="none" stroke-linecap="round">
      <animate attributeName="transform" type="translate" values="0,0; -40,0; 0,0" dur="18s" repeatCount="indefinite" />
    </path>
    <path d="M520,44 Q570,38 630,44 Q680,48 730,44" stroke="#484f58" stroke-width="1.5" fill="none" stroke-linecap="round">
      <animate attributeName="transform" type="translate" values="0,0; -50,0; 0,0" dur="22s" repeatCount="indefinite" />
    </path>
    <path d="M900,42 Q950,37 1010,42 Q1060,46 1110,42" stroke="#484f58" stroke-width="1.5" fill="none" stroke-linecap="round">
      <animate attributeName="transform" type="translate" values="0,0; -40,0; 0,0" dur="20s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- ========================================================== -->
  <!-- 2. THE AIRPLANE (ANIMATED FLIGHT ACROSS THE CORRIDOR)       -->
  <!-- ========================================================== -->
  <g>
    <!-- Master Translation: Left to Right across the screen -->
    <animateTransform attributeName="transform" type="translate" from="-260 0" to="1260 0" dur="9.5s" repeatCount="indefinite" />

    <!-- Aerodynamic Floating/Bobbing (Gentle Altitude Sway) -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,28; 0,26.5; 0,29.5; 0,28" dur="4.2s" repeatCount="indefinite" />

      <!-- A. EXPANDING JET CONTRAIL VAPOR TRAILS (Streaming from Engines) -->
      <g opacity="0.85">
        <!-- Upper Engine Contrail -->
        <rect x="-180" y="-3.5" width="165" height="2.2" rx="1.1" fill="url(#contrailGrad)">
          <animate attributeName="width" values="150;185;150" dur="2s" repeatCount="indefinite" />
          <animate attributeName="opacity" values="0.75;0.95;0.75" dur="2s" repeatCount="indefinite" />
        </rect>
        <!-- Lower Engine Contrail -->
        <rect x="-180" y="4.5" width="165" height="2.5" rx="1.2" fill="url(#contrailGrad)">
          <animate attributeName="width" values="160;190;160" dur="2s" begin="-1s" repeatCount="indefinite" />
          <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" begin="-1s" repeatCount="indefinite" />
        </rect>
      </g>

      <!-- B. JET ENGINE AFTERBURNER FLAMES -->
      <g filter="url(#jetThrustGlow)">
        <!-- Upper Engine Core Flame -->
        <polygon points="-12,-3.5 -26,-2.5 -12,-1.5" fill="url(#engineFlameGrad)">
          <animate attributeName="points" values="-12,-3.5 -26,-2.5 -12,-1.5; -12,-3.5 -32,-2.5 -12,-1.5; -12,-3.5 -26,-2.5 -12,-1.5" dur="0.25s" repeatCount="indefinite" />
        </polygon>
        <!-- Lower Engine Core Flame -->
        <polygon points="-8,4.5 -24,5.5 -8,6.5" fill="url(#engineFlameGrad)">
          <animate attributeName="points" values="-8,4.5 -24,5.5 -8,6.5; -8,4.5 -30,5.5 -8,6.5; -8,4.5 -24,5.5 -8,6.5" dur="0.28s" repeatCount="indefinite" />
        </polygon>
      </g>

      <!-- C. THE AIRCRAFT BODY (SLEEK MODERN TWIN-JET AIRLINER) -->
      <g filter="url(#planeGlow)">

        <!-- 1. Far Wing (Port Wing in Background) -->
        <polygon points="-5,-4 8,-4 -12,-16 -18,-15" fill="#484f58" stroke="#30363d" stroke-width="0.5" />
        <!-- Far Winglet -->
        <line x1="-18" y1="-15" x2="-20" y2="-19" stroke="#00f0ff" stroke-width="1.2" />

        <!-- 2. Horizontal Tail Stabilizer (Elevator) -->
        <polygon points="-46,-2 -36,-2 -48,-10 -53,-9" fill="#6e7681" stroke="#30363d" stroke-width="0.5" />

        <!-- 3. Vertical Tail Fin (Rudder) -->
        <polygon points="-38,-4 -28,-4 -44,-22 -50,-22" fill="url(#fuselageGrad)" stroke="#30363d" stroke-width="0.6" />
        <!-- Airline Tail Accent Stripe (Cyan / Electric Blue livery) -->
        <polygon points="-40,-12 -34,-12 -42,-21 -47,-21" fill="#00f0ff" opacity="0.9" />

        <!-- Tail Strobe Light (White Flashing Beacon) -->
        <circle cx="-47" cy="-22" r="1.8" fill="#ffffff" filter="url(#beaconGlow)">
          <animate attributeName="opacity" values="1;0;0;1;0;0" dur="1.2s" repeatCount="indefinite" />
        </circle>

        <!-- 4. Main Fuselage (Aero Sleek Body) -->
        <!-- Aerodynamic bullet nose to tapered tail cone -->
        <path d="M-48,-1 Q-20,-5 20,-5 Q48,-5 58,1 Q46,7 18,7 Q-20,7 -48,2 Z" fill="url(#fuselageGrad)" stroke="#30363d" stroke-width="0.75" />

        <!-- Nose Cone Radar Radome -->
        <path d="M50,-2 Q58,1 50,4 Z" fill="#30363d" opacity="0.6" />

        <!-- Cockpit Windshield (Sleek Aviator Glass) -->
        <path d="M42,-3 L48,-2 L46,0 L41,-0.5 Z" fill="url(#windowGlowGrad)" stroke="#161b22" stroke-width="0.4" />

        <!-- Passenger Window Strip (Illuminated Cabin Windows) -->
        <g fill="url(#windowGlowGrad)" opacity="0.85">
          <rect x="-32" y="0" width="3" height="2" rx="0.5" />
          <rect x="-26" y="0" width="3" height="2" rx="0.5" />
          <rect x="-20" y="0" width="3" height="2" rx="0.5" />
          <rect x="-14" y="0" width="3" height="2" rx="0.5" />
          <rect x="-8" y="0" width="3" height="2" rx="0.5" />
          <rect x="-2" y="0" width="3" height="2" rx="0.5" />
          <rect x="4" y="0" width="3" height="2" rx="0.5" />
          <rect x="10" y="0" width="3" height="2" rx="0.5" />
          <rect x="16" y="0" width="3" height="2" rx="0.5" />
          <rect x="22" y="0" width="3" height="2" rx="0.5" />
          <rect x="28" y="0" width="3" height="2" rx="0.5" />
          <rect x="34" y="0" width="3" height="2" rx="0.5" />
        </g>

        <!-- Airline Livery Pinstripe -->
        <path d="M-44,3 Q0,3 44,3" stroke="#00f0ff" stroke-width="0.8" opacity="0.85" />

        <!-- 5. Near Main Swept Wing (Starboard Wing in Foreground) -->
        <polygon points="-8,3 15,3 -6,17 -14,16" fill="url(#fuselageGrad)" stroke="#30363d" stroke-width="0.6" />
        <!-- Winglet Tip (Turned Upward) -->
        <polygon points="-14,16 -12,21 -10,21 -12,16" fill="#00f0ff" />

        <!-- Wingtip Starboard Green Nav Light -->
        <circle cx="-11" cy="21" r="1.6" fill="#22c55e" filter="url(#beaconGlow)">
          <animate attributeName="opacity" values="1;0.4;1" dur="1s" repeatCount="indefinite" />
        </circle>

        <!-- 6. Turbofan Jet Engines -->
        <!-- Upper Engine Pod -->
        <g transform="translate(0, -3)">
          <rect x="-12" y="-1" width="16" height="4" rx="1.5" fill="#30363d" stroke="#484f58" stroke-width="0.5" />
          <line x1="4" y1="-1" x2="4" y2="3" stroke="#8b949e" stroke-width="0.8" />
        </g>

        <!-- Lower Engine Pod (Mounted on Near Wing) -->
        <g transform="translate(4, 5)">
          <rect x="-12" y="-1" width="18" height="5" rx="1.8" fill="#21262d" stroke="#484f58" stroke-width="0.6" />
          <ellipse cx="6" cy="1.5" rx="1" ry="2.2" fill="#8b949e" />
          <!-- Engine Pylon to Wing -->
          <line x1="-2" y1="-1" x2="-2" y2="-4" stroke="#484f58" stroke-width="1.2" />
        </g>

        <!-- 7. Anti-Collision Fuselage Beacon (Red Flashing Strobe on Top) -->
        <circle cx="-5" cy="-5.5" r="1.6" fill="#ef4444" filter="url(#beaconGlow)">
          <animate attributeName="opacity" values="1;0.1;1" dur="0.9s" repeatCount="indefinite" />
        </circle>

      </g>
    </g>
  </g>
</svg>
