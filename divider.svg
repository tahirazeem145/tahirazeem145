<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 32" width="100%" height="32" fill="none" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Laser Glow Filters -->
    <filter id="laserCyanGlow" x="-20%" y="-150%" width="140%" height="400%">
      <feGaussianBlur stdDeviation="4" result="blur1" />
      <feGaussianBlur stdDeviation="1.5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="laserPurpleGlow" x="-20%" y="-150%" width="140%" height="400%">
      <feGaussianBlur stdDeviation="4" result="blur1" />
      <feGaussianBlur stdDeviation="1.5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="coreGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Base Track Linear Gradient -->
    <linearGradient id="baseTrackGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0" />
      <stop offset="15%" stop-color="#30363d" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.5" />
      <stop offset="85%" stop-color="#30363d" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </linearGradient>

    <!-- Digital Stream Dash Gradient -->
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0" />
      <stop offset="25%" stop-color="#00f0ff" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.7" />
      <stop offset="75%" stop-color="#00f0ff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </linearGradient>

    <!-- Forward Laser Beam (Cyan -> White Head) -->
    <linearGradient id="forwardBeamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0" />
      <stop offset="40%" stop-color="#8b5cf6" stop-opacity="0.4" />
      <stop offset="75%" stop-color="#00f0ff" stop-opacity="0.85" />
      <stop offset="96%" stop-color="#e0f2fe" stop-opacity="1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1" />
    </linearGradient>

    <!-- Counter Laser Beam (White Head -> Purple Tail) -->
    <linearGradient id="counterBeamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="4%" stop-color="#f5d0fe" stop-opacity="1" />
      <stop offset="25%" stop-color="#c084fc" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#9333ea" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </linearGradient>

    <!-- Ambient Glow Line Gradient -->
    <linearGradient id="ambientGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0" />
      <stop offset="35%" stop-color="#00f0ff" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.5" />
      <stop offset="65%" stop-color="#00f0ff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- ========================================================== -->
  <!-- 1. BACKGROUND STATIC & AMBIENT RAILS                       -->
  <!-- ========================================================== -->
  
  <!-- Subtle dark circuit rail -->
  <line x1="60" y1="16" x2="1140" y2="16" stroke="url(#baseTrackGrad)" stroke-width="1.5" />

  <!-- Breathing Ambient Glow Line -->
  <line x1="180" y1="16" x2="1020" y2="16" stroke="url(#ambientGrad)" stroke-width="3" filter="url(#coreGlow)">
    <animate attributeName="opacity" values="0.25;0.75;0.25" dur="3.6s" repeatCount="indefinite" />
  </line>

  <!-- Continuous Flowing Data Stream (Subtle Dash Offset Animation) -->
  <line x1="80" y1="16" x2="1120" y2="16" stroke="url(#streamGrad)" stroke-width="1.2" stroke-dasharray="14 28" opacity="0.7">
    <animate attributeName="stroke-dashoffset" from="0" to="-420" dur="8s" repeatCount="indefinite" />
  </line>

  <!-- ========================================================== -->
  <!-- 2. HIGH-INTENSITY LASER PULSES                             -->
  <!-- ========================================================== -->

  <!-- PRIMARY FORWARD LASER (Left to Right, High Energy Cyan) -->
  <g filter="url(#laserCyanGlow)">
    <!-- Wide Ambient Halo -->
    <rect y="13.5" height="5" rx="2.5" fill="url(#forwardBeamGrad)" opacity="0.6">
      <animate attributeName="x" from="-220" to="1220" dur="3.8s" repeatCount="indefinite" />
      <animate attributeName="width" values="100;180;220;180;100" dur="3.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.5;0.8;0.5;0" dur="3.8s" repeatCount="indefinite" />
    </rect>

    <!-- Sharp Intense Core Beam -->
    <rect y="14.8" height="2.4" rx="1.2" fill="url(#forwardBeamGrad)">
      <animate attributeName="x" from="-220" to="1220" dur="3.8s" repeatCount="indefinite" />
      <animate attributeName="width" values="80;160;200;160;80" dur="3.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.9;1;0.9;0" dur="3.8s" repeatCount="indefinite" />
    </rect>

    <!-- Sparkling Leading Comet Head -->
    <circle cy="16" r="3.2" fill="#ffffff">
      <animate attributeName="cx" from="-20" to="1220" dur="3.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;1;1;0" dur="3.8s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- COUNTER PULSE LASER (Right to Left, Vivid Ultraviolet / Purple) -->
  <g filter="url(#laserPurpleGlow)">
    <!-- Wide Ambient Halo -->
    <rect y="13.5" height="5" rx="2.5" fill="url(#counterBeamGrad)" opacity="0.55">
      <animate attributeName="x" from="1220" to="-220" dur="5.2s" begin="-2.1s" repeatCount="indefinite" />
      <animate attributeName="width" values="90;160;190;160;90" dur="5.2s" begin="-2.1s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.45;0.75;0.45;0" dur="5.2s" begin="-2.1s" repeatCount="indefinite" />
    </rect>

    <!-- Sharp Intense Core Beam -->
    <rect y="14.8" height="2.4" rx="1.2" fill="url(#counterBeamGrad)">
      <animate attributeName="x" from="1220" to="-220" dur="5.2s" begin="-2.1s" repeatCount="indefinite" />
      <animate attributeName="width" values="70;140;170;140;70" dur="5.2s" begin="-2.1s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.8;0.95;0.8;0" dur="5.2s" begin="-2.1s" repeatCount="indefinite" />
    </rect>

    <!-- Sparkling Leading Comet Head -->
    <circle cy="16" r="2.8" fill="#ffffff">
      <animate attributeName="cx" from="1220" to="-20" dur="5.2s" begin="-2.1s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.9;1;0.9;0" dur="5.2s" begin="-2.1s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- ========================================================== -->
  <!-- 3. END TERMINAL ACCENTS                                    -->
  <!-- ========================================================== -->
  <g opacity="0.8">
    <!-- Left Terminal Node -->
    <circle cx="70" cy="16" r="2" fill="#00f0ff" filter="url(#coreGlow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <line x1="60" y1="12" x2="60" y2="20" stroke="#00f0ff" stroke-width="1" opacity="0.5" />

    <!-- Right Terminal Node -->
    <circle cx="1130" cy="16" r="2" fill="#00f0ff" filter="url(#coreGlow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <line x1="1140" y1="12" x2="1140" y2="20" stroke="#00f0ff" stroke-width="1" opacity="0.5" />
  </g>

  <!-- ========================================================== -->
  <!-- 4. CENTER CYBERNETIC EMBLEM & REACTOR CORE                 -->
  <!-- ========================================================== -->
  <g transform="translate(600, 16)">
    <!-- Dark Backplate Backdrop -->
    <rect x="-24" y="-11" width="48" height="22" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1" />

    <!-- Pulsing Radar / Energy Rings -->
    <circle cx="0" cy="0" r="5" fill="none" stroke="#00f0ff" stroke-width="1" opacity="0.8">
      <animate attributeName="r" values="4;13;15" dur="2.6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0.2;0" dur="2.6s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="5" fill="none" stroke="#a855f7" stroke-width="1" opacity="0.8">
      <animate attributeName="r" values="4;13;15" dur="2.6s" begin="-1.3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0.2;0" dur="2.6s" begin="-1.3s" repeatCount="indefinite" />
    </circle>

    <!-- Center Soft Glow Aura -->
    <circle cx="0" cy="0" r="6" fill="#00f0ff" opacity="0.35" filter="url(#coreGlow)">
      <animate attributeName="opacity" values="0.25;0.65;0.25" dur="2s" repeatCount="indefinite" />
      <animate attributeName="r" values="5;7.5;5" dur="2s" repeatCount="indefinite" />
    </circle>

    <!-- Rotating Center Cross / Reticle -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite" />
      <line x1="-7" y1="0" x2="7" y2="0" stroke="#58a6ff" stroke-width="0.75" opacity="0.6" />
      <line x1="0" y1="-7" x2="0" y2="7" stroke="#58a6ff" stroke-width="0.75" opacity="0.6" />
    </g>

    <!-- Center Diamond Core -->
    <g filter="url(#coreGlow)">
      <polygon points="0,-4.5 4.5,0 0,4.5 -4.5,0" fill="#00f0ff" />
      <circle cx="0" cy="0" r="1.8" fill="#ffffff">
        <animate attributeName="r" values="1.4;2.4;1.4" dur="1.8s" repeatCount="indefinite" />
      </circle>
    </g>
  </g>
</svg>
