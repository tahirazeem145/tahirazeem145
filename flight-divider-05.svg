<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 64" width="100%" height="64" fill="none" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Hardware-Accelerated Strobe Glow Flares (Pure Vector Radial Gradients, 0% CPU Filter Lag) -->
    <radialGradient id="redBeaconFlare" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4d4f" stop-opacity="1" />
      <stop offset="35%" stop-color="#ef4444" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#ef4444" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="whiteStrobeFlare" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="40%" stop-color="#e0f2fe" stop-opacity="0.75" />
      <stop offset="75%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="greenNavFlare" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="1" />
      <stop offset="40%" stop-color="#22c55e" stop-opacity="0.75" />
      <stop offset="75%" stop-color="#16a34a" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#16a34a" stop-opacity="0" />
    </radialGradient>

    <!-- Flight Corridor Path Gradient -->
    <linearGradient id="flightPathGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0" />
      <stop offset="15%" stop-color="#58a6ff" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.5" />
      <stop offset="85%" stop-color="#58a6ff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </linearGradient>

    <!-- Jet Contrail Gradient (High Density Vapor Trail) -->
    <linearGradient id="contrailGrad" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="15%" stop-color="#bae6fd" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="85%" stop-color="#0284c7" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </linearGradient>

    <!-- Jet Engine Afterburner Flame Gradient -->
    <linearGradient id="thrustFlameGrad" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="20%" stop-color="#67e8f9" stop-opacity="1" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <!-- Fuselage Metallic Gradient -->
    <linearGradient id="fuselageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#e2e8f0" />
      <stop offset="75%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Cabin and Cockpit Window Glow -->
    <linearGradient id="windowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Banner Holographic Border Gradient -->
    <linearGradient id="bannerBorderGrad" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="bannerFillGrad" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0c1322" stop-opacity="0.98" />
      <stop offset="50%" stop-color="#111827" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0.92" />
    </linearGradient>
  </defs>

  <style>
    @keyframes smoothAeroCruise {
      0% {
        transform: translate3d(-460px, 0, 0);
      }
      100% {
        transform: translate3d(1750px, 0, 0);
      }
    }
    .smooth-flight-assembly {
      animation: smoothAeroCruise 18s linear infinite;
      will-change: transform;
    }
  </style>

  <!-- Base Ambient Airway Track -->
  <line x1="40" y1="32" x2="1160" y2="32" stroke="#21262d" stroke-width="1.2" />

  <!-- Flowing Dashed Airway Navigation Vector -->
  <line x1="60" y1="32" x2="1140" y2="32" stroke="url(#flightPathGrad)" stroke-width="1.5" stroke-dasharray="12 20" opacity="0.75">
    <animate attributeName="stroke-dashoffset" from="0" to="-320" dur="8s" repeatCount="indefinite" />
  </line>

  <!-- Flight Waypoints and Telemetry HUD -->
  <g opacity="0.6" font-family="'JetBrains Mono', monospace" font-size="6" font-weight="600" fill="#8b949e">
    <circle cx="140" cy="32" r="2" fill="#58a6ff" />
    <text x="140" y="22" text-anchor="middle" fill="#58a6ff">FLIGHT TA-145</text>

    <circle cx="600" cy="32" r="2.5" fill="#a855f7" />
    <text x="600" y="22" text-anchor="middle" fill="#c084fc">ALT 36,000 FT // CRUISE // RADAR ACTIVE</text>
    <line x1="585" y1="32" x2="615" y2="32" stroke="#a855f7" stroke-width="1" />

    <circle cx="1060" cy="32" r="2" fill="#58a6ff" />
    <text x="1060" y="22" text-anchor="middle" fill="#58a6ff">WAYPOINT DELTA</text>
  </g>

  <!-- High-Altitude Cirrus Cloud Layer -->
  <g opacity="0.18">
    <path d="M80,50 Q140,44 210,50 Q270,54 330,50" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round">
      <animate attributeName="transform" type="translate" values="0,0; -40,0; 0,0" dur="20s" repeatCount="indefinite" />
    </path>
    <path d="M500,52 Q570,46 640,52 Q710,56 780,52" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round">
      <animate attributeName="transform" type="translate" values="0,0; -50,0; 0,0" dur="24s" repeatCount="indefinite" />
    </path>
    <path d="M920,50 Q980,45 1050,50 Q1110,54 1170,50" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round">
      <animate attributeName="transform" type="translate" values="0,0; -40,0; 0,0" dur="22s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- THE AIRPLANE AND TOWED SKY-BANNER ASSEMBLY -->
  <!-- GPU Compositor-Accelerated 18s Silky Smooth Glide (Sub-Pixel 60/120/144Hz Smoothness) -->
  <g class="smooth-flight-assembly">
    <animateTransform attributeName="transform" type="translate"
      from="-460 0" to="1750 0"
      dur="18s" repeatCount="indefinite" />

    <!-- Static Vertical Centering at y=32 -->
    <g transform="translate(0, 32)">

      <!-- 1. TOW CABLES (Linking Aircraft Tail to Banner) -->
      <g stroke="#94a3b8" stroke-width="1.2" opacity="0.9">
        <line x1="-64" y1="-1" x2="-96" y2="-9" stroke-dasharray="4 2" />
        <line x1="-64" y1="5" x2="-96" y2="9" stroke-dasharray="4 2" />
      </g>

      <!-- 2. TOWED SKY-BANNER (DISPLAYING SECTION NAME) -->
      <g>
        <!-- Spreader Bar at Banner Leading Edge -->
        <line x1="-96" y1="-11" x2="-96" y2="11" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round" />
        <circle cx="-96" cy="-9" r="1.8" fill="#00f0ff" />
        <circle cx="-96" cy="9" r="1.8" fill="#00f0ff" />

        <!-- Banner Body with Swallowtail Notch -->
        <path d="M-96,-11 L-400,-11 L-385,0 L-400,11 L-96,11 Z" fill="url(#bannerFillGrad)" stroke="url(#bannerBorderGrad)" stroke-width="1.4" />

        <!-- Banner Accent Details: Pinstripes -->
        <line x1="-96" y1="-8" x2="-390" y2="-8" stroke="#00f0ff" stroke-width="0.6" opacity="0.6" />
        <line x1="-96" y1="8" x2="-390" y2="8" stroke="#00f0ff" stroke-width="0.6" opacity="0.6" />

        <!-- Towed Section Name Typography -->
        <g font-family="'JetBrains Mono', 'Space Grotesk', -apple-system, monospace">
          <!-- Leading Tag Badge -->
          <rect x="-150" y="-7" width="48" height="14" rx="3" fill="rgba(0, 240, 255, 0.25)" stroke="#00f0ff" stroke-width="1" />
          <text x="-126" y="3.5" fill="#00f0ff" font-size="8" font-weight="bold" text-anchor="middle" letter-spacing="1">NEXT ✈</text>

          <!-- Centered Section Title -->
          <text x="-240" y="3.5" fill="#ffffff" font-size="9" font-weight="800" text-anchor="middle" letter-spacing="0.8">05 // BUILDER MINDSET</text>
          
          <!-- Trailing Subtitle Pill -->
          <text x="-355" y="3.5" fill="#c084fc" font-size="7" font-weight="600" text-anchor="middle" letter-spacing="0.5">THE PHILOSOPHY</text>
        </g>
      </g>

      <!-- 3. JET ENGINE CONTRAIL TRAILS (Ultra Clean Gradient Stream) -->
      <g opacity="0.85">
        <rect x="-160" y="-15" width="145" height="2.2" rx="1.1" fill="url(#contrailGrad)" />
        <rect x="-160" y="14" width="145" height="2.4" rx="1.2" fill="url(#contrailGrad)" />
      </g>

      <!-- 4. JET ENGINE AFTERBURNER FLAMES -->
      <g>
        <polygon points="-16,-4.5 -40,-3 -16,-1.5" fill="url(#thrustFlameGrad)" />
        <polygon points="-10,5.5 -36,7 -10,8.5" fill="url(#thrustFlameGrad)" />
      </g>

      <!-- 5. THE AIRCRAFT -->
      <g>
        <!-- Far Port Wing -->
        <polygon points="-8,-5 12,-5 -18,-20 -25,-19" fill="#475569" stroke="#334155" stroke-width="0.6" />
        <line x1="-25" y1="-19" x2="-27" y2="-24" stroke="#00f0ff" stroke-width="1.5" />
        <!-- Port Wingtip Red Nav Light (Pure Vector Gradient Glow) -->
        <circle cx="-27" cy="-24" r="3.5" fill="url(#redBeaconFlare)" />
        <circle cx="-27" cy="-24" r="1.2" fill="#ffffff" />

        <!-- Horizontal Tail Stabilizer -->
        <polygon points="-60,-2 -46,-2 -64,-12 -70,-11" fill="#64748b" stroke="#334155" stroke-width="0.6" />

        <!-- Vertical Tail Fin -->
        <polygon points="-50,-4 -36,-4 -58,-28 -66,-28" fill="url(#fuselageGrad)" stroke="#334155" stroke-width="0.75" />
        <polygon points="-52,-14 -44,-14 -56,-26 -63,-26" fill="#00f0ff" opacity="0.9" />

        <!-- White Tail Strobe Beacon (Pure Vector Gradient Glow) -->
        <circle cx="-62" cy="-28" r="4" fill="url(#whiteStrobeFlare)" />
        <circle cx="-62" cy="-28" r="1.5" fill="#ffffff" />

        <!-- Main Fuselage -->
        <path d="M-64,-1 Q-25,-6 25,-6 Q65,-6 76,1 Q62,8 24,8 Q-25,8 -64,2 Z" fill="url(#fuselageGrad)" stroke="#334155" stroke-width="0.9" />

        <!-- Cockpit Windshield -->
        <path d="M54,-3.5 L63,-2 L60,1 L53,0 Z" fill="url(#windowGrad)" stroke="#0f172a" stroke-width="0.5" />

        <!-- Illuminated Cabin Windows -->
        <g fill="url(#windowGrad)" opacity="0.9">
          <rect x="-42" y="0" width="3.5" height="2.4" rx="0.6" />
          <rect x="-34" y="0" width="3.5" height="2.4" rx="0.6" />
          <rect x="-26" y="0" width="3.5" height="2.4" rx="0.6" />
          <rect x="-18" y="0" width="3.5" height="2.4" rx="0.6" />
          <rect x="-10" y="0" width="3.5" height="2.4" rx="0.6" />
          <rect x="-2" y="0" width="3.5" height="2.4" rx="0.6" />
          <rect x="6" y="0" width="3.5" height="2.4" rx="0.6" />
          <rect x="14" y="0" width="3.5" height="2.4" rx="0.6" />
          <rect x="22" y="0" width="3.5" height="2.4" rx="0.6" />
          <rect x="30" y="0" width="3.5" height="2.4" rx="0.6" />
          <rect x="38" y="0" width="3.5" height="2.4" rx="0.6" />
          <rect x="46" y="0" width="3.5" height="2.4" rx="0.6" />
        </g>

        <!-- Cyan Livery Stripe -->
        <path d="M-58,4 Q0,4 58,4" stroke="#00f0ff" stroke-width="1" opacity="0.9" />

        <!-- Near Starboard Wing -->
        <polygon points="-12,4 20,4 -10,22 -20,21" fill="url(#fuselageGrad)" stroke="#334155" stroke-width="0.75" />
        <polygon points="-20,21 -17,27 -14,27 -17,21" fill="#00f0ff" />
        <!-- Starboard Wingtip Green Nav Light (Pure Vector Gradient Glow) -->
        <circle cx="-15.5" cy="27" r="3.5" fill="url(#greenNavFlare)" />
        <circle cx="-15.5" cy="27" r="1.2" fill="#ffffff" />

        <!-- Turbofan Engines -->
        <g transform="translate(-2, -4)">
          <rect x="-14" y="-1.5" width="20" height="5.5" rx="2" fill="#334155" stroke="#475569" stroke-width="0.6" />
          <line x1="5" y1="-1.5" x2="5" y2="4" stroke="#94a3b8" stroke-width="1" />
        </g>
        <g transform="translate(6, 6)">
          <rect x="-16" y="-1.5" width="24" height="6.5" rx="2.2" fill="#1e293b" stroke="#475569" stroke-width="0.75" />
          <ellipse cx="7" cy="1.7" rx="1.2" ry="2.8" fill="#94a3b8" />
          <line x1="-3" y1="-1.5" x2="-3" y2="-5" stroke="#475569" stroke-width="1.5" />
        </g>

        <!-- Red Top Strobe Beacon (Pure Vector Gradient Glow) -->
        <circle cx="-6" cy="-6.8" r="3.8" fill="url(#redBeaconFlare)" />
        <circle cx="-6" cy="-6.8" r="1.2" fill="#ffffff" />
      </g>
    </g>
  </g>
</svg>