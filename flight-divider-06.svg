<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 40" width="100%" height="40" fill="none" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="neonTrackGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0" />
      <stop offset="15%" stop-color="#f472b6" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.6" />
      <stop offset="85%" stop-color="#f472b6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="orbTrailGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.95" />
    </linearGradient>

    <radialGradient id="neonOrbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="28%" stop-color="#f472b6" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#a855f7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    @keyframes neonOrbGlide {
      0% { transform: translate3d(-80px, 0, 0); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translate3d(1280px, 0, 0); opacity: 0; }
    }
    .neon-orb-runner {
      animation: neonOrbGlide 5.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      will-change: transform, opacity;
    }
  </style>

  <!-- Subtle Base Line -->
  <line x1="40" y1="20" x2="1160" y2="20" stroke="#27272a" stroke-width="1" />
  <line x1="40" y1="20" x2="1160" y2="20" stroke="url(#neonTrackGrad)" stroke-width="1.5" />

  <!-- Simple Neon Ball + Soft Glow Trail -->
  <g class="neon-orb-runner">
    <rect x="-110" y="18.8" width="110" height="2.4" rx="1.2" fill="url(#orbTrailGrad)" />
    <circle cx="0" cy="20" r="14" fill="url(#neonOrbGlow)" />
    <circle cx="0" cy="20" r="4.5" fill="#f472b6" />
    <circle cx="0" cy="20" r="2" fill="#ffffff" />
  </g>
</svg>
